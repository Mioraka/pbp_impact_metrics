name: Test NBA award data pull for 2025-26

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-nba-awards-2025-26.yml
      - scripts/pull_award_season.py
      - data/award_candidates_2025-26.csv

permissions:
  contents: write

concurrency:
  group: nba-award-season-test
  cancel-in-progress: false

jobs:
  pull-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install requests
      - name: Pull 2025-26 All-NBA and All-Defensive selections from NBA Stats
        run: python -u scripts/pull_award_season.py --season 2025-26
      - name: Confirm complete season file
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('data/player_award_selections_2025-26.csv')
          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 25, f'Expected 25 award selections, found {len(rows)}'
          assert len({row['player_id'] for row in rows}) == 23
          assert all(row['player_id'] and row['team_id'] for row in rows)
          assert sum(row['award'] == 'All-NBA' for row in rows) == 15
          assert sum(row['award'] == 'All-Defensive' for row in rows) == 10
          print('PASS: 25 selections, 23 players, IDs and team IDs populated')
          PY
      - name: Upload pull audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-awards-2025-26-test
          path: |
            validation/awards_2025-26_audit.json
            data/player_award_selections_2025-26.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Publish validated CSV
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player_award_selections_2025-26.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish NBA All-NBA and All-Defensive selections for 2025-26'
          git push origin HEAD:main
