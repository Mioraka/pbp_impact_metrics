name: Refresh NBA player game logs

on:
  push:
    branches: [game-log-refresh]
    paths:
      - 'staged-game-log-refresh.json'

concurrency:
  group: nba-player-game-logs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow
      - name: Apply validated game log update
        env:
          REFRESH_SHA: ${{ github.sha }}
        run: |
          git fetch --depth=1 origin "$REFRESH_SHA"
          git show "$REFRESH_SHA:staged-game-log-refresh.json" > "$RUNNER_TEMP/game-log-refresh.json"
          python -u scripts/pull_player_game_logs.py --apply-refresh "$RUNNER_TEMP/game-log-refresh.json"
      - name: Publish player game logs
        run: |
          git add data/nba_player_game_logs.parquet
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh NBA player game logs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
