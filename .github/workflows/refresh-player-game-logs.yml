name: Refresh NBA player game logs

on:
  workflow_dispatch:
  schedule:
    - cron: '19 9 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-player-game-logs.yml'

concurrency:
  group: nba-player-game-logs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyarrow
      - run: python -u scripts/pull_player_game_logs.py --incremental
      - name: Publish player game logs
        run: |
          git add data/nba_player_game_logs.parquet
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh NBA player game logs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
