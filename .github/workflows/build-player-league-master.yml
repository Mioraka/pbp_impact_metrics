name: Daily current-season player and league refresh

on:
  workflow_dispatch:
  schedule:
    # Toronto 07:00 is 11:00 UTC in summer and 12:00 UTC in winter.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/player_list.csv'
      - 'data/metric_definitions.csv'
      - '.github/workflows/build-player-league-master.yml'

concurrency:
  group: pbp-player-league-master
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Select Toronto morning schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          local = datetime.now(ZoneInfo('America/Toronto'))
          # Use scheduled UTC slot and today's Toronto offset, allowing delayed jobs.
          summer = local.utcoffset().total_seconds() == -14400
          slot = '0 11 * * *' if summer else '0 12 * * *'
          run = os.environ['EVENT_NAME'] != 'schedule' or os.environ['SCHEDULE'] == slot
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'run={str(run).lower()}\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies and validate
        if: steps.clock.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt pandas
          python -m unittest discover -s tests -v
      - name: Refresh all current-season data and rebuild master
        if: steps.clock.outputs.run == 'true'
        run: python -u scripts/refresh_current_season.py
      - name: Publish complete refresh
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player_advanced_metrics.csv data/league_season_averages.csv data/player_on_off_volume.csv data/player_league_master.csv data/run_manifest.json data/request_log.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete daily current-season refresh [skip ci]'
            # Reject concurrent branch changes rather than mixing snapshots.
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: success() && steps.clock.outputs.run == 'true'
        with:
          name: daily-player-league-master
          path: data/*.csv
          retention-days: 30
