name: Pull all NBA player-season on-off metrics

on:
  workflow_dispatch:

concurrency:
  group: nba-on-off-full-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull:
    name: Season ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Restore successful request checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: pbp-onoff-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pbp-onoff-v1-${{ matrix.year }}-
      - name: Refresh current-season snapshot on new runs
        if: matrix.year == 2026 && github.run_attempt == 1
        run: rm -rf .cache
      - name: Pull season with request retries and resumable passes
        env:
          SEASON_YEAR: ${{ matrix.year }}
        shell: bash
        run: |
          for pass in 1 2 3; do
            if python -u pull_on_off.py --start-year "$SEASON_YEAR" --end-year "$SEASON_YEAR" --workers 4 --output "season_results/$SEASON_YEAR"; then
              exit 0
            fi
            if [ "$pass" -lt 3 ]; then
              echo "Resuming unsuccessful partitions after pass $pass"
              sleep 30
            fi
          done
          exit 1
      - name: Save successful request checkpoints even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: pbp-onoff-v1-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload season results and failure audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-${{ matrix.year }}
          path: season_results/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Validate and publish all CSV results
    needs: pull
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: season-*
          path: season_results
          merge-multiple: true
      - name: Validate coverage, keys, failures and schema before combining
        run: python combine_results.py --source season_results --output data
      - name: Publish validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish complete NBA player-season on-off CSV snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
